name: Build & check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Plugin rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check plugin rules
        run: python3 .github/scripts/check_plugins.py

  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # Makes sure nobody swapped gradle-wrapper.jar for something malicious.
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build
      - name: Upload plugin JARs
        uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: plugins/*/build/libs/tf-*.jar
          if-no-files-found: error
          retention-days: 7
